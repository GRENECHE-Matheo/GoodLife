name: Remove relay

# Supprime définitivement le relais Cloudflare (et donc la clé Gemini qui y était stockée).
on:
  workflow_dispatch:

jobs:
  remove:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Supprimer le Worker goodlife-relay
        run: npx --yes wrangler@4 delete --name goodlife-relay --force
      - name: Vérifier qu'il ne répond plus
        run: |
          sleep 15
          code=$(curl -s -o /dev/null -w '%{http_code}' https://goodlife-relay.matheo-greneche0.workers.dev/health || true)
          echo "HTTP $code"
          [ "$code" != "200" ]
