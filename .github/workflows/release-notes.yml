name: Notes de version

# Recopie chaque section de CHANGELOG.md dans la release GitHub correspondante,
# dès que le journal change sur main (ou à la main depuis l'onglet Actions).
on:
  push:
    branches: [ main ]
    paths: [ 'CHANGELOG.md', '.github/release-notes.sh', '.github/workflows/release-notes.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mettre à jour les notes des releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(grep -oE '^## v[0-9][^ ]*' CHANGELOG.md | cut -c4-); do
            if gh release view "$tag" > /dev/null 2>&1; then
              sh .github/release-notes.sh "$tag" > notes.md
              gh release edit "$tag" --notes-file notes.md
              echo "✔ $tag"
            else
              echo "– $tag : pas de release"
            fi
          done
          # La release « Latest » (lue par la mise à jour de l'app) = la plus récente du journal
          newest=$(grep -oE '^## v[0-9][^ ]*' CHANGELOG.md | head -1 | cut -c4-)
          if gh release view "$newest" > /dev/null 2>&1; then
            gh release edit "$newest" --latest
            echo "Latest : $newest"
          fi
