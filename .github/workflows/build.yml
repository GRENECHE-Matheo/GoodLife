name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
    # Pas de compilation pour un simple changement de texte (les tags compilent toujours)
    paths-ignore: [ '**.md' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Préparer la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.GOODLIFE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/goodlife.jks"
            echo "GOODLIFE_KEYSTORE=$RUNNER_TEMP/goodlife.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Pas de keystore : APK signé avec une clé de debug."
          fi

      - name: Compiler l'APK (GitHub) et l'AAB (Google Play)
        env:
          GOODLIFE_KEYSTORE_PASSWORD: ${{ secrets.GOODLIFE_KEYSTORE_PASSWORD }}
          GOODLIFE_KEY_ALIAS: ${{ secrets.GOODLIFE_KEY_ALIAS }}
          GOODLIFE_KEY_PASSWORD: ${{ secrets.GOODLIFE_KEY_PASSWORD }}
        run: gradle assembleGithubRelease bundlePlayRelease --stacktrace --no-daemon

      - name: Renommer
        run: |
          cp app/build/outputs/apk/github/release/app-github-release.apk "GoodLife-${GITHUB_REF_NAME//\//-}.apk"
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "GoodLife-play-${GITHUB_REF_NAME//\//-}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: GoodLife-apk
          path: GoodLife-*.apk

      # Fichier à envoyer dans la Play Console (non publié dans la release GitHub)
      - uses: actions/upload-artifact@v4
        with:
          name: GoodLife-play-aab
          path: GoodLife-play-*.aab

      - name: Notes de version (tirées de CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/')
        run: sh .github/release-notes.sh "$GITHUB_REF_NAME" > notes.md

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: GoodLife ${{ github.ref_name }}
          files: GoodLife-*.apk
          body_path: notes.md
          # « Latest » est réglé juste après, d'après CHANGELOG.md (plusieurs tags peuvent compiler en même temps)
          make_latest: false

      # L'app (version GitHub) cherche sa mise à jour dans la release « Latest » : ce doit être la plus récente
      - name: Marquer la version la plus récente comme « Latest »
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(grep -oE '^## v[0-9][^ ]*' CHANGELOG.md | head -1 | cut -c4-)
          if gh release view "$newest" > /dev/null 2>&1; then
            gh release edit "$newest" --latest
            echo "Latest : $newest"
          fi
