# Relais GoodLife : garde la clé Gemini côté serveur (jamais dans l'app).
name = "goodlife-relay"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true

[vars]
MODEL = "gemini-3.5-flash-lite"
DAILY_LIMIT_PER_INSTALL = "10"
DAILY_LIMIT_PER_IP = "30"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "Limiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Limiter"]
